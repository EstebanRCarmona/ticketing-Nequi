        failureRateThreshold: ${CB_FAILURE_RATE_THRESHOLD:50}
        slowCallRateThreshold: ${CB_SLOW_CALL_RATE_THRESHOLD:80}
        slowCallDurationThreshold: ${CB_SLOW_CALL_DURATION:10s}
        recordExceptions:
