services:
  localstack:
    image: localstack/localstack:3.4
    container_name: localstack_nequi_ticketing
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=0
    volumes:
      - "./deployment/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "order-processing-queue"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: app_ticketing_nequi
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SERVER_PORT=8080
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_EC2_METADATA_DISABLED=true
      - AWS_DYNAMODB_ENDPOINT=http://localstack:4566
      - AWS_SQS_ENDPOINT=http://localstack:4566
      - TABLE_EVENTS=ticketing-events
      - TABLE_INVENTORY=ticketing-inventory
      - TABLE_ORDERS=ticketing-orders
      - TABLE_ORDER_HISTORY=ticketing-order-history
      - TABLE_IDEMPOTENCY=ticketing-idempotency
      - AWS_SQS_PROCESSING_QUEUE_URL=http://localstack:4566/000000000000/order-processing-queue
      - AWS_SQS_EXPIRATION_QUEUE_URL=http://localstack:4566/000000000000/order-expiration-queue
      - AWS_SQS_POLL_INTERVAL_MS=5000
      - EXPIRED_RESERVATIONS_INTERVAL_MS=60000
      - cors.allowed-origins=http://localhost:3000,http://localhost:8080
    depends_on:
      localstack:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
